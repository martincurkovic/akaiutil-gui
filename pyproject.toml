[project]
name = "akaiutil-gui"
version = "0.0.1"
description = "A cross-platform Qt GUI for akaiutil (Akai S900/S1000/S3000 filesystem tool). Proof of concept: drives the akaiutil CLI as a subprocess."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Qt 6.12 is the current LTS line; 6.8 is the previous one but the
    # open-source wheels stopped at 6.8.3 (Mar 2025). To fall back, pin
    # "PySide6-Essentials==6.8.3" (needs Python <3.14).
    # -Essentials has Widgets/Multimedia; the full "PySide6" meta-package
    # would also pull in WebEngine & friends (hundreds of MB we don't use).
    "PySide6-Essentials>=6.12,<6.13",
]

[project.scripts]
akaiutil-gui = "akaiutil_gui.main:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
